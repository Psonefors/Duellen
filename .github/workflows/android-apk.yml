
name: Bygg Duellen APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      
      - name: Ordna projektfiler
        run: |
          mkdir -p lib assets/web assets/data assets/audio
          cp main.dart game.dart question_packs.dart race.dart lib/
          cp player.html assets/web/
          cp questions.json assets/data/
          cp next.wav reveal.wav win.wav tick.wav answer_music.wav assets/audio/

      - name: Skapa Android-projekt
        run: flutter create --platforms android --project-name duellen --no-pub .

      - name: Återställ spelkoden
        run: |
          cp main.dart game.dart question_packs.dart race.dart lib/
          rm -rf test
          rm -f analysis_options.yaml

      - name: Tillåt lokalt nätverk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace(
              '<application',
              '<uses-permission android:name="android.permission.INTERNET" />\n'
              '<application android:usesCleartextTraffic="true"',
              1
          )
          p.write_text(s)
          PY

      - name: Installera paket
        run: flutter pub get
        
      - name: Rätta Android SDK för filimport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('android/app/build.gradle.kts')
          if app.exists():
              s = app.read_text()
              s = re.sub(
                  r'compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)',
                  'compileSdk = 36', s)
              app.write_text(s)

          cache = Path.home() / '.pub-cache/hosted/pub.dev'
          files = list(cache.glob('file_picker-*/android/build.gradle'))
          files += list(cache.glob('file_picker-*/android/build.gradle.kts'))
          if not files:
              raise RuntimeError('Hittar inte file_picker i paketcache')

          for p in files:
              s = p.read_text()
              s = re.sub(r'compileSdkVersion\s+34\b',
                         'compileSdkVersion 36', s)
              s = re.sub(r'compileSdk\s*=\s*34\b',
                         'compileSdk = 36', s)
              p.write_text(s)
              print('Uppdaterad:', p)
          PY

      - name: Kontrollera kod
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Bygg APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Duellen-APK
          path: build/app/outputs/flutter-apk/app-release.apk

