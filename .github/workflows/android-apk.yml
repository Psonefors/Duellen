
name: Bygg Duellen APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Installera Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installera Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ordna projektfiler
        run: |
          set -e
          mkdir -p lib assets/web assets/data assets/audio
          cp main.dart game.dart question_packs.dart race.dart lib/
          cp player.html assets/web/
          cp questions.json assets/data/
          cp next.wav reveal.wav win.wav tick.wav answer_music.wav assets/audio/

      - name: Skapa Android-projekt
        run: flutter create --platforms android --project-name duellen --no-pub .

      - name: Återställ spelkod efter Flutter create
        run: |
          set -e
          cp main.dart game.dart question_packs.dart race.dart lib/
          rm -rf test
          rm -f analysis_options.yaml

      - name: Tillåt lokalt nätverk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1) if 'usesCleartextTraffic' not in s else s
          p.write_text(s)
          PY

      - name: Installera Flutter-paket
        run: flutter pub get

      - name: Installera Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'

      - name: Rätta Android SDK for app och file_picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(path):
              src = path.read_text()
              if path.suffix == '.kts':
                  patterns = [
                      (r'(?m)^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)', r'\g<1>compileSdk = 36'),
                      (r'(?m)^(\s*)compileSdkVersion\s*\(\s*(?:flutter\.compileSdkVersion|\d+)\s*\)', r'\g<1>compileSdk = 36'),
                  ]
              else:
                  patterns = [
                      (r'(?m)^(\s*)compileSdkVersion\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)', r'\g<1>compileSdkVersion 36'),
                      (r'(?m)^(\s*)compileSdk\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)', r'\g<1>compileSdk 36'),
                  ]
              out = src
              count = 0
              for pattern, repl in patterns:
                  out, n = re.subn(pattern, repl, out)
                  count += n
              if not count:
                  raise RuntimeError(f'Kunde inte hitta compileSdk i {path}. Kontrollera paketversionen.')
              path.write_text(out)
              print(f'{path}: compileSdk justerad till 36 ({count} ersättning/ar)')

          app = Path('android/app/build.gradle.kts')
          if not app.exists():
              app = Path('android/app/build.gradle')
          if not app.exists():
              raise RuntimeError('Hittade inte appens Gradle-fil')
          patch(app)

          cache = Path.home() / '.pub-cache/hosted/pub.dev'
          plugin_files = sorted(cache.glob('file_picker-*/android/build.gradle'))
          plugin_files += sorted(cache.glob('file_picker-*/android/build.gradle.kts'))
          if not plugin_files:
              raise RuntimeError('file_picker hittades inte efter flutter pub get')
          for plugin in plugin_files:
              patch(plugin)
          PY

      - name: Kontrollera spelkoden
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Bygg APK
        run: flutter build apk --release

      - name: Publicera APK
        uses: actions/upload-artifact@v4
        with:
          name: Duellen-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
